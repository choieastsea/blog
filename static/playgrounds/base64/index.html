<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Base64 Encoder / Decoder | Playground</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #ffffff;
      --bg-secondary: #f4f4f5;
      --border: #e4e4e7;
      --text: #18181b;
      --text-muted: #71717a;
      --accent: #18181b;
      --accent-hover: #3f3f46;
      --error-bg: #fef2f2;
      --error-border: #fecaca;
      --error-text: #dc2626;
      --success-bg: #f0fdf4;
      --success-border: #bbf7d0;
      --success-text: #16a34a;
      --tab-active-bg: #18181b;
      --tab-active-text: #ffffff;
      --tab-inactive-bg: transparent;
      --tab-inactive-text: #71717a;
      --copy-bg: #f4f4f5;
      --copy-text: #3f3f46;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #09090b;
        --bg-secondary: #18181b;
        --border: #27272a;
        --text: #fafafa;
        --text-muted: #a1a1aa;
        --accent: #fafafa;
        --accent-hover: #d4d4d8;
        --error-bg: #1c0a0a;
        --error-border: #7f1d1d;
        --error-text: #f87171;
        --success-bg: #052e16;
        --success-border: #14532d;
        --success-text: #4ade80;
        --tab-active-bg: #fafafa;
        --tab-active-text: #09090b;
        --tab-inactive-bg: transparent;
        --tab-inactive-text: #a1a1aa;
        --copy-bg: #27272a;
        --copy-text: #d4d4d8;
      }
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
    }

    .top-nav {
      margin-bottom: 2.5rem;
    }

    .back-link {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.875rem;
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      transition: color 0.15s;
    }

    .back-link:hover {
      color: var(--text);
    }

    .page-header {
      margin-bottom: 2rem;
    }

    .page-title {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      margin-bottom: 0.375rem;
    }

    .page-desc {
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    .tab-group {
      display: inline-flex;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 3px;
      margin-bottom: 1.5rem;
    }

    .tab-btn {
      padding: 0.4rem 1.1rem;
      border: none;
      border-radius: 6px;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      background: var(--tab-inactive-bg);
      color: var(--tab-inactive-text);
    }

    .tab-btn.active {
      background: var(--tab-active-bg);
      color: var(--tab-active-text);
    }

    .section {
      margin-bottom: 1rem;
    }

    .section-label {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }

    textarea {
      width: 100%;
      min-height: 140px;
      padding: 0.75rem 1rem;
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
      font-size: 0.875rem;
      line-height: 1.6;
      background: var(--bg-secondary);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      resize: vertical;
      outline: none;
      transition: border-color 0.15s;
    }

    textarea:focus {
      border-color: var(--accent);
    }

    textarea::placeholder {
      color: var(--text-muted);
    }

    .output-wrapper {
      position: relative;
    }

    .output-box {
      width: 100%;
      min-height: 140px;
      padding: 0.75rem 1rem;
      padding-right: 5.5rem;
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
      font-size: 0.875rem;
      line-height: 1.6;
      background: var(--bg-secondary);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      white-space: pre-wrap;
      word-break: break-all;
      min-height: 140px;
    }

    .output-placeholder {
      color: var(--text-muted);
    }

    .copy-btn {
      position: absolute;
      top: 0.625rem;
      right: 0.625rem;
      padding: 0.3rem 0.75rem;
      font-size: 0.75rem;
      font-weight: 500;
      background: var(--copy-bg);
      color: var(--copy-text);
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .copy-btn:hover {
      background: var(--border);
    }

    .copy-btn.copied {
      background: var(--success-bg);
      color: var(--success-text);
      border-color: var(--success-border);
    }

    .error-box {
      padding: 0.75rem 1rem;
      background: var(--error-bg);
      border: 1px solid var(--error-border);
      border-radius: 8px;
      color: var(--error-text);
      font-size: 0.875rem;
      margin-top: 0.5rem;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin: 1rem 0;
      color: var(--text-muted);
      font-size: 0.75rem;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    footer {
      margin-top: 3rem;
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useCallback, useEffect } = React;

    function encodeBase64(text) {
      const bytes = new TextEncoder().encode(text);
      const binString = Array.from(bytes, b => String.fromCodePoint(b)).join('');
      return btoa(binString);
    }

    function decodeBase64(base64) {
      const cleaned = base64.replace(/\s/g, '');
      const binString = atob(cleaned);
      const bytes = Uint8Array.from(binString, c => c.codePointAt(0));
      return new TextDecoder().decode(bytes);
    }

    function App() {
      const [mode, setMode] = useState('encode');
      const [input, setInput] = useState('');
      const [output, setOutput] = useState('');
      const [error, setError] = useState('');
      const [copied, setCopied] = useState(false);

      useEffect(() => {
        if (!input.trim()) {
          setOutput('');
          setError('');
          return;
        }
        try {
          if (mode === 'encode') {
            setOutput(encodeBase64(input));
          } else {
            setOutput(decodeBase64(input));
          }
          setError('');
        } catch (e) {
          setOutput('');
          setError('유효하지 않은 Base64 문자열입니다. 입력값을 확인해주세요.');
        }
      }, [input, mode]);

      const handleModeChange = useCallback((newMode) => {
        setMode(newMode);
        setInput('');
        setOutput('');
        setError('');
        setCopied(false);
      }, []);

      const handleCopy = useCallback(() => {
        if (!output) return;
        navigator.clipboard.writeText(output).then(() => {
          setCopied(true);
          setTimeout(() => setCopied(false), 2000);
        });
      }, [output]);

      const inputLabel = mode === 'encode' ? '원본 텍스트' : 'Base64';
      const outputLabel = mode === 'encode' ? 'Base64' : '디코딩 결과';
      const inputPlaceholder = mode === 'encode'
        ? '인코딩할 텍스트를 입력하세요...'
        : '디코딩할 Base64 문자열을 입력하세요...';

      return (
        <div className="container">
          <nav className="top-nav">
            <a href="/" className="back-link">← 블로그로 돌아가기</a>
          </nav>

          <header className="page-header">
            <h1 className="page-title">Base64 Encoder / Decoder</h1>
            <p className="page-desc">텍스트를 Base64로 인코딩하거나, Base64를 텍스트로 디코딩합니다. 한국어(UTF-8)를 지원합니다.</p>
          </header>

          <div className="tab-group">
            <button
              className={`tab-btn ${mode === 'encode' ? 'active' : ''}`}
              onClick={() => handleModeChange('encode')}
            >
              Encode
            </button>
            <button
              className={`tab-btn ${mode === 'decode' ? 'active' : ''}`}
              onClick={() => handleModeChange('decode')}
            >
              Decode
            </button>
          </div>

          <div className="section">
            <div className="section-label">{inputLabel}</div>
            <textarea
              value={input}
              onChange={e => setInput(e.target.value)}
              placeholder={inputPlaceholder}
              spellCheck={false}
            />
          </div>

          <div className="divider">{mode === 'encode' ? '↓ 인코딩' : '↓ 디코딩'}</div>

          <div className="section">
            <div className="section-label">{outputLabel}</div>
            <div className="output-wrapper">
              <div className="output-box">
                {output
                  ? output
                  : <span className="output-placeholder">결과가 여기에 표시됩니다</span>
                }
              </div>
              {output && (
                <button
                  className={`copy-btn ${copied ? 'copied' : ''}`}
                  onClick={handleCopy}
                >
                  {copied ? '복사됨 ✓' : '복사'}
                </button>
              )}
            </div>
            {error && <div className="error-box">{error}</div>}
          </div>

          <footer>
            <a href="/playgrounds/" style={{color: 'var(--text-muted)', textDecoration: 'none'}}>Playgrounds</a>
            {' · '}
            <a href="/" style={{color: 'var(--text-muted)', textDecoration: 'none'}}>choieastsea.github.io</a>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
